aid: nines-conformance
name: Nines / Sirona Medical Standards Conformance
description: >-
  Cross-cutting and industry standards conformance for Nines, whose AI radiology
  technology (NinesAI Emergent Triage, NinesMeasure) and team were acquired by
  Sirona Medical in February 2022 and folded into the RadOS platform. Claims are
  taken from Sirona Medical's public security/compliance and interoperability
  pages; there is no public developer API, so API-protocol standards are not
  applicable.
