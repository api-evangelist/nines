name: Nines
description: >-
  Nines was a teleradiology and medical-imaging AI startup founded in 2017 and
  backed by Accel and 8VC (a $16.5M Series A in 2019), co-founded by CEO David
  Stavens. It built FDA-cleared AI algorithms — NinesAI Emergent Triage (for
  intracranial hemorrhage and mass effect) and NinesMeasure (a lung-nodule
  algorithm) — alongside a live teleradiology practice. On 2022-02-18, Sirona
  Medical acquired Nines' AI technology, clinical data pipeline, machine-learning
  engines, and key personnel, folding the FDA-cleared devices into RadOS, Sirona's
  cloud-native Radiology Operating System (reporter, viewer, PACS, worklist, and
  platform AI). The nines.com domain now redirects to sironamedical.com. There is
  no public developer API today; a RadOS "Amplify" SDK (TypeScript/Python, REST +
  streaming APIs, event subscriptions) is on Sirona's roadmap as an early-access
  program for design partners.
